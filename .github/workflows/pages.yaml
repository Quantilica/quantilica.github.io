name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_releases.py _pages/assets/releases.json

      - name: Stage site files
        run: |
          mkdir -p _pages/assets
          cp index.html site.webmanifest _pages/
          cp favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png _pages/
          cp assets/quantilica-logo-icon.png _pages/assets/quantilica-logo-icon.png
          mkdir -p _pages/assets/apps
          cp assets/apps/*.webp _pages/assets/apps/
          mkdir -p _pages/assets/art
          cp assets/art/*.webp _pages/assets/art/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_pages"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
